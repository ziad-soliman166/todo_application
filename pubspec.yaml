name: todo_application
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.0.15
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1
  easy_date_timeline: ^1.1.3
  flutter_screenutil: ^5.9.3
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_localization: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Enable localization code generation by adding the following:
  generate: true
